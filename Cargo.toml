[package]
name = "time-manager"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sc-time-manager"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
chrono = {version="0.4.31", features=["serde"]}
crossterm = "0.27.0"
itertools = "0.12.1"
ratatui = "0.26.0"
rust_xlsxwriter = {version="0.61.0", features=["chrono"]}
serde = {version="1.0.196", features=["derive"]}
serde_json = "1.0.113"
ort = "2.0.0-rc.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "handleapi", "processenv", "winbase", "wincon", "winnt", "winuser"] }
